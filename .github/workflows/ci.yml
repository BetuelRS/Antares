name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android — build + testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5

      - run: chmod +x gradlew

      # Os testes correm na variante **debug** e o artefacto compila-se na **release**, em
      # vez do `build`, que corria as duas.
      #
      # O `build` incluía o `testReleaseUnitTest`, e os testes de interface não podem correr
      # aí: o `compose-ui-test-manifest`, que declara a `ComponentActivity` onde eles compõem,
      # entra como `debugImplementation`. Na release não existe, e o Robolectric falha com
      # «Unable to resolve activity». Pô-lo na release seria enviar uma activity de teste
      # dentro da app que as pessoas instalam.
      #
      # O CI esteve vermelho desde que os testes de interface entraram, e ninguém tinha por
      # onde ver — o repositório era só de escrita para quem estava a trabalhar.
      - name: Testes unitários (debug)
        run: ./gradlew :composeApp:testDebugUnitTest --console=plain

      - name: Compilar a release
        run: ./gradlew :composeApp:assembleRelease --console=plain

      # Os dois assentam numa linha de base com o que já existia à data em que foram
      # ligados: só código novo faz o CI falhar. Refazer uma linha de base é decisão
      # consciente, e o guia dos testes diz como.
      - name: detekt
        run: ./gradlew :composeApp:detekt --console=plain

      - name: Lint do Android
        run: ./gradlew :composeApp:lintDebug --console=plain

  functions:
    name: Edge Functions — testes Deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Testes das funções
        working-directory: supabase
        run: deno test -A functions/_shared/

      - name: Verificação de tipos
        working-directory: supabase
        run: deno check functions/analyze-food/index.ts functions/analyze-exercise/index.ts functions/delete-account/index.ts functions/admin-unlock/index.ts

  secrets:
    name: Nenhum segredo no repositório
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Procurar chaves
        run: |
          if grep -rInE "sk-ant-(api|admin)[A-Za-z0-9_-]{10,}" --exclude-dir=.git .; then
            echo "::error::chave da Anthropic no repositório"; exit 1
          fi
          if grep -rInE "eyJ[A-Za-z0-9_-]{40,}" --exclude-dir=.git .; then
            echo "::error::JWT/chave de serviço no repositório"; exit 1
          fi
          echo "limpo"
